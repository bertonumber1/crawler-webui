name: test

on:
  push:
    branches: [main]
  pull_request:
  # Lets the suite be run on demand, so a CI fix can be verified without
  # having to push another commit to provoke it.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
