services:
  crawler-webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crawler-webui
    restart: "no"  # owner: fully off 2026-09-19
    network_mode: "container:gluetun"

    environment:
      # Without this the container runs on UTC - an hour behind the rest of the stack
      # in BST, which makes its timestamps disagree with every other service's logs.
      TZ: Europe/London
      CW_DB_PATH: /data/crawler.db
      CW_FOLDERWATCH: /jdownloader-folderwatch
      CW_DOWNLOAD_ROOT: ${CW_DOWNLOAD_ROOT:-/output/_CRAWLER}
      CW_OUTPUT_UID: ${CW_OUTPUT_UID:-1000}
      CW_OUTPUT_GID: ${CW_OUTPUT_GID:-1000}
      CW_DIRECT_GAP: ${CW_DIRECT_GAP:-3-8}
      CW_DIRECT_WORKERS: ${CW_DIRECT_WORKERS:-1}
      CW_JD_RULES_PATH: /data/custom.linkcrawlerrules.json

      # JD's own list files, read-only. Without this the app can only report
      # that a crawljob was written, never that JD actually took it.
      CW_JD_CFG: /jdownloader-cfg

      # Browser session for members-only boards. Lives on the data volume so
      # it survives a rebuild; it is a credential, so it never enters the image.
      CW_COOKIES_FILE: /data/cookies.txt

      # MyJDownloader. Compose substitutes these from ./.env, which is
      # gitignored, so the credentials never enter the image or the repo.
      # Unset, the app falls back to reading JD's save files.
      CW_MYJD_EMAIL: ${CW_MYJD_EMAIL:-}
      CW_MYJD_PASSWORD: ${CW_MYJD_PASSWORD:-}
      CW_MYJD_DEVICE: ${CW_MYJD_DEVICE:-}

      # Which file hosts to harvest. "cloud" = Rapidgator plus every free
      # cloud drive (MEGA, Google Drive, TeraBox, Dropbox, ...); "all" or a
      # comma-separated list of keys (see crawler/hosts.py) without a rebuild.
      CRAWLER_HOSTS: ${CRAWLER_HOSTS:-cloud}

      # Hosts read like a person browsing (browser UA, one page at a time,
      # random pause between pages) -- see crawler/fetch.py. Empty = off.
      CW_STEALTH_HOSTS: ${CW_STEALTH_HOSTS:-}
      CW_STEALTH_OS: ${CW_STEALTH_OS:-linux}
      CW_STEALTH_GAP: ${CW_STEALTH_GAP:-90-150}
      # Default date window for every crawl, in months (0 = no limit). The
      # value saved from the UI ("only the last N months") takes precedence.
      CW_SINCE_MONTHS: ${CW_SINCE_MONTHS:-0}

      # Thank-you poster. The only thing here that writes to a board, so it
      # is off unless CW_THANKS_ENABLED is set AND started by hand in the UI,
      # and it stays in dry run until that is turned off too. See .env.example.
      CW_THANKS_ENABLED: ${CW_THANKS_ENABLED:-0}
      CW_THANKS_HOSTS: ${CW_THANKS_HOSTS:-foroactivo.com}
      CW_THANKS_MESSAGE: ${CW_THANKS_MESSAGE:-gracias amigo}
      CW_THANKS_BURST: ${CW_THANKS_BURST:-3}
      CW_THANKS_WINDOW: ${CW_THANKS_WINDOW:-1500}
      CW_THANKS_SPACING: ${CW_THANKS_SPACING:-40-90}
      CW_THANKS_DAILY_MAX: ${CW_THANKS_DAILY_MAX:-24}
      CW_THANKS_ROBOTS: ${CW_THANKS_ROBOTS:-respect}

      # Diagnostic trace: bounded ring for the UI plus a rotating file.
      CRAWLER_TRACE: ${CRAWLER_TRACE:-1}
      CRAWLER_TRACE_FILE: /logs/trace.log
      CRAWLER_TRACE_KEEP: ${CRAWLER_TRACE_KEEP:-2000}

      FLARESOLVERR_ENABLED: ${FLARESOLVERR_ENABLED:-1}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://127.0.0.1:8191/v1}
      FLARESOLVERR_TIMEOUT: ${FLARESOLVERR_TIMEOUT:-120}
      FLARESOLVERR_ON: ${FLARESOLVERR_ON:-403,429,503}

    volumes:
      - ${CRAWLER_DATA_DIR:-./data}:/data
      - ${CRAWLER_LOG_DIR:-./logs}:/logs
      - ${JDOWNLOADER_FOLDERWATCH:-/home/media/docker/torrentvpn-app/jdownloader/config/folderwatch}:/jdownloader-folderwatch
      # Read-only: JD owns these files and is running. We only ever read them.
      - ${JDOWNLOADER_CFG:-/home/media/docker/torrentvpn-app/jdownloader/config/cfg}:/jdownloader-cfg:ro
      # JD's own output, mounted at the same path JD sees it: the polite
      # fetcher (crawler/direct.py) saves self-hosting sites' files here.
      - ${JDOWNLOADER_OUTPUT:-/mnt/usb-b/drive/downloads/jdownloader}:/output

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/api/jd', timeout=4)"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
