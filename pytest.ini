[pytest]
# Put the repo root on sys.path so `from crawler import ...` resolves.
#
# Without this only `python -m pytest` works, because that form adds the
# working directory to sys.path while the bare `pytest` script does not. CI
# runs the bare script, so every test errored on collection with
# "No module named 'crawler'" while the same tests passed locally.
pythonpath = .
testpaths = tests
